[project]
name = "tenderpilot"
version = "0.1.0"
description = "TenderPilot DE backend — foundation skeleton (Chapter 3/4)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "httpx",
    "boto3>=1.43.93",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "boto3-stubs[s3]>=1.43.93",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"
